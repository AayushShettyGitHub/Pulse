server:
  port: ${PORT:8080}

backend:
  url: ${BACKEND_URL:http://localhost:8082}

spring:
  application:
    name: gateway
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@userKeyResolver}"
      routes:
        - id: auth_route
          uri: ${backend.url}
          predicates:
            - Path=/api/auth/**
        - id: backend_route
          uri: ${backend.url}
          predicates:
            - Path=/api/**

jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForJWTAuthenticationPurposesOnlyChangeThis}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    root: INFO
    com.example.gateway: DEBUG
